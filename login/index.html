<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — PromptChat</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="auth-card">
    <a class="logo" href="../landing/">PromptChat</a>

    <h1>Welcome back</h1>
    <p class="subtitle">Log in and get back to the conversation.</p>

    <form id="login-form">
        <label for="email">Email</label>
        <input
            id="email"
            type="email"
            placeholder="you@example.com"
            required
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required
        >

        <p id="message"></p>

        <button type="submit">Log in</button>
    </form>

    <p class="switch">
        Don't have an account?
        <a href="../signup/">Sign up</a>
    </p>
</div>

<script>
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    // Raspberry Pi API — temporary LAN address for testing
    const API_URL = "http://10.0.0.29:3000";

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.textContent = "Logging in...";
        message.className = "";

        try {
            const response = await fetch(`${API_URL}/api/auth/login`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                message.textContent = data.error || "Invalid email or password.";
                message.className = "error";
                return;
            }

            message.textContent = "Logged in successfully!";
            message.className = "success";

            console.log("Logged in user:", data.user);

            // We'll add the actual logged-in session/redirect here later.
            
        } catch (error) {
            console.error("Login request failed:", error);

            message.textContent =
                "Unable to connect to the PromptChat server.";
            message.className = "error";
        }
    });
</script>

</body>
</html>
