<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sign Up — PromptChat</title> <link rel="stylesheet" href="../css/auth.css"> </head> <body>

<div class="auth-card"> <a class="logo" href="../landing/">PromptChat</a>

<h1>Create your account</h1>
<p class="subtitle">Start messaging without the noise.</p>

<form id="signup-form">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="your_username" maxlength="32" required>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" required>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Create a password" required>

    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" type="password" placeholder="Enter your password again" required>

    <p id="message"></p>

    <button type="submit">Create account</button>
</form>

<p class="switch">
    Already have an account?
    <a href="../login/">Log in</a>
</p>

</div>

<script> const form = document.getElementById("signup-form"); const password = document.getElementById("password"); const confirmPassword = document.getElementById("confirm-password"); const message = document.getElementById("message"); form.addEventListener("submit", function(event) { event.preventDefault(); if (password.value !== confirmPassword.value) { message.textContent = "Passwords do not match."; message.className = "error"; return; } message.textContent = "Ready to create your account."; message.className = "success"; }); </script>

</body> </html>
