<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web-promptchat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1e21;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            padding: 12px;
            color: #b3c293;
        }

        .container {
            border: 1px solid #7d8b63;
            border-radius: 12px;
            min-height: calc(100vh - 24px);
            padding: 8px 16px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .nav-link {
            color: #b3c293;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <a href="#" class="nav-link">web-promptchat</a>
            <a href="#" class="nav-link">sign in</a>
        </nav>
    </div>
</body>
</html>
